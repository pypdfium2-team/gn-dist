name: Build
on:
  workflow_dispatch:
    inputs:
      cibw_py_ver:
        type: string
        default: 'cp314'
      publish:
        type: boolean
        default: false
      actually_publish:
        type: boolean
        default: false

permissions: {}

jobs:
  
  build:
    permissions:
      contents: read  # needed by called workflow
    strategy:
      fail-fast: false
      matrix:
        cibw_os: ["manylinux", "musllinux"]
        cibw_arch: ["x86_64", "i686", "aarch64", "armv7l", "ppc64le", "s390x", "riscv64", "loongarch64"]
        exclude:
          # Container failure (persistent since a few weeks): Cannot download repomd.xml
          - cibw_os: manylinux
            cibw_arch: i686
    
    uses: ./.github/workflows/build_one.yaml
    with:
      os: ${{ (matrix.cibw_arch == 'aarch64' || matrix.cibw_arch == 'armv7l') && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
      cibw_os: ${{ matrix.cibw_os }}
      cibw_arch: ${{ matrix.cibw_arch }}
      cibw_py_ver: ${{ inputs.cibw_py_ver }}
  
  
  sdist:
    name: Craft sdist
    permissions:
      contents: read  # recommended by checkout action
    
    runs-on: ubuntu-slim
    steps:
      
      - name: Check out repository (deep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # for git describe
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      
      - name: Create venv & Install pip packages (cool)
        run: |
          python3 -m venv .venv
          export PIP_UPLOADED_PRIOR_TO=P3D
          ./.venv/bin/python3 -m pip install --no-deps --only-binary ':all:' -r lock/pip.txt
          ./.venv/bin/python3 -m pip install -U pip
          export PIP_UPLOADED_PRIOR_TO=P7D
          ./.venv/bin/python3 -m pip install build setuptools
      
      - name: Package sdist
        run: ./.venv/bin/python3 -m build -sxn
      
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ./dist/*.tar.gz
          name: dist-sdist
  
  
  publish:
    name: ${{ inputs.actually_publish && 'Publish to PyPI & GH (actually)' || 'Publish (dry run)' }}
    needs: [build, sdist]
    if: ${{ inputs.publish && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-slim
    
    environment: release   # PyPI upload via "trusted publishing"
    permissions:
      id-token: write      # PyPI upload via "trusted publishing", and GH attestation
      attestations: write  # GH attestation
    
    steps:
      
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # for git describe
      
      - name: Download assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true
          pattern: dist-*
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      
        # By default, keep a cooldown as sanity check for our lockfiles. However, cooldown *could* be disabled if urgent updates to the lockfiles were required (e.g. security). Just lower or unset PIP_UPLOADED_PRIOR_TO if needed.
      - name: Create venv & Install pip packages (frozen)
        run: |
          python3 -m venv .venv
          export PIP_UPLOADED_PRIOR_TO=P3D
          ./.venv/bin/python3 -m pip install --no-deps --only-binary ':all:' -r lock/pip.txt
          ./.venv/bin/python3 -m pip install -U pip
          export PIP_UPLOADED_PRIOR_TO=P7D
          ./.venv/bin/python3 -m pip install --no-deps --only-binary ':all:' -r lock/distcheck.txt
      
      - name: Verify dists
        run: |
          PATH="${PWD}/.venv/bin:${PATH}"
          twine check dist/*
          check-wheel-contents dist/*.whl
      
      - name: Mask non-PyPI builds
        run: |
          mkdir artifacts/ && cp dist/* -t artifacts/
          shopt -s nullglob
          rm -f dist/*linux_*_loongarch64*.whl
      
      - name: Determine version
        id: get_version
        run: |
          VERSION=$(git describe --exact-match)  # ensure tagged commit
          echo "Determined version $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      
      - name: Attest build provenance
        if: ${{ inputs.actually_publish }}
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'artifacts/*'
      
      - name: Rename provenance file
        if: ${{ inputs.actually_publish }}
        run: mv "$SRC_PATH" gn-attestation.json
        env:
          SRC_PATH: ${{ steps.provenance.outputs.bundle-path }}
      
      - name: Publish to PyPI
        if: ${{ inputs.actually_publish }}
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/
      
      - name: Publish to GitHub
        if: ${{ inputs.actually_publish }}
        run: gh release create "$TAG" --title "$TAG" --verify-tag $BETA_FLAG artifacts/* gn-attestation.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.version }}
          BETA_FLAG: ${{ contains(steps.get_version.outputs.version, 'b') && '--prerelease' || '' }}
