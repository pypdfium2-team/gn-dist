version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/lock"
    schedule:
      interval: "quarterly"
    cooldown:
      default-days: 7
    groups:
      python-packages:
        patterns:
          - "*"
