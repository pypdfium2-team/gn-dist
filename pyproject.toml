[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

# TODO consider removing the project table altogether, as it is potentially impedimental to backward compatibility
[project]
name = "gn-dist"
dynamic = ["version", "scripts"]
description = "Binary distributions of GN (generate-ninja) for Linux."
readme = "README.md"
authors = [{ name = "pypdfium2-team", email = "geisserml@gmail.com" }]
license = "BSD-3-Clause"

[project.urls]
repository = "https://github.com/pypdfium2-team/gn-dist"

[tool.check-wheel-contents]
# W002: possible erroneous detection of __init__.py files as duplicates
# W009: Wheel contains multiple toplevel library entries
# W010: Toplevel library directory contains no Python modules (gn_dist.libs)
ignore = ["W002", "W009", "W010"]

[tool.cibuildwheel]
build-frontend = {name="build", args=["-xn"]}
before-build = ["pip install -U setuptools"]
test-command = [
    "python {project}/utils/test.py",
    # TODO ...
]

[tool.cibuildwheel.linux]
manylinux-armv7l-image = "ghcr.io/mayeut/manylinux_2_35:latest"

# install ninja

[[tool.cibuildwheel.overrides]]
select = "*-manylinux_*"
before-all = [
    "dnf clean all && dnf makecache --refresh",
    "dnf -y install ninja-build",
]

# temporary workaround because dnf somehow fails to resolve a working mirror
[[tool.cibuildwheel.overrides]]
select = "*-manylinux_i686"
inherit.before-all = "none"
before-all = []
inherit.before-build = "append"
before-build = ["pip install -U ninja"]

# manylinux_armv7l uses a Ubuntu-based image, for lack of an RHEL-based one
[[tool.cibuildwheel.overrides]]
select = "*-manylinux_armv7l"
before-all = [
    "apt-get update",
    "apt-get install -y ninja-build",
]

[[tool.cibuildwheel.overrides]]
select = "*-musllinux_*"
before-all = ["apk add ninja-build"]
inherit.environment = "append"
environment.PATH = "/usr/lib/ninja-build/bin:$PATH"

[[tool.cibuildwheel.overrides]]
select = "*-*linux_{ppc64le,riscv64,loongarch64,s390x}"
environment-pass = ["RUNNER_ARCH"]
inherit.before-all = "append"
before-all = [
    "manylinux-install-clang -v latest",
    "export CLANG_PREFIX=/opt/clang",
    "ln -s $CLANG_PREFIX/bin/readelf $CLANG_PREFIX/bin/llvm-readelf",
]
inherit.environment = "append"
environment.BUILD_PARAMS = "-c clang --clang-path /opt/clang"
